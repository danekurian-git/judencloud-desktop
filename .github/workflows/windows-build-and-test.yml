name: Windows Build and Test
on:
  workflow_dispatch:
    inputs:
      create_installer:
        description: 'Package and verify an unsigned privateCloud Windows installer after tests pass'
        type: boolean
        default: false
      tested_build_run:
        description: 'Optional prior run with successful desktop tests; reuse its compiled inputs for packaging'
        type: string
        default: ''
  push:
    branches: [master, 'privatecloud/**']
    paths:
      - 'src/**'
      - 'test/**'
      - 'theme/**'
      - 'cmake/**'
      - '*.cmake'
      - 'CMakeLists.txt'
      - 'config.h.in'
      - 'resources.qrc'
      - 'craftmaster.ini'
      - '.github/workflows/windows-build-and-test.yml'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !inputs.tested_build_run && github.event.action != 'closed' && !github.event.pull_request.draft }}
    name: Windows Build and Test
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CRAFT_TARGET: windows-msvc2022_64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster.ini
      PYTHON_VERSION: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve Craft dependency revisions
        id: craft-revisions
        shell: pwsh
        run: |
          function configValue($key) {
              $escapedKey = [regex]::Escape($key)
              $matches = @(Select-String -Path "${{ env.CRAFT_MASTER_CONFIG }}" -Pattern "^\s*$escapedKey\s*=\s*(.+?)\s*$")
              if($matches.Count -ne 1) {
                  throw "Expected exactly one $key value in craftmaster.ini."
              }
              return $matches[0].Matches[0].Groups[1].Value.Trim()
          }

          $craftRevision = configValue "CraftRevision"
          $kdeBlueprintRef = configValue "craft/craft-blueprints-kde.revision"
          $nextcloudBlueprintRef = configValue "craft/craft-blueprints-nextcloud.revision"

          function remoteRevision($repository, $ref) {
              $revision = git ls-remote $repository $ref
              if($LASTEXITCODE -ne 0 -or !$revision) {
                  throw "Could not resolve $ref from $repository."
              }
              return ($revision -split '\s+')[0]
          }

          $kdeBlueprintRevision = remoteRevision "https://github.com/nextcloud/craft-blueprints-kde.git" "refs/heads/$kdeBlueprintRef"
          $nextcloudBlueprintRevision = remoteRevision "https://github.com/nextcloud/craft-blueprints-nextcloud.git" "refs/heads/$nextcloudBlueprintRef"
          @(
              "kde_ref=$kdeBlueprintRef"
              "nextcloud_ref=$nextcloudBlueprintRef"
              "key=$craftRevision-$kdeBlueprintRevision-$nextcloudBlueprintRevision"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore Craft dependencies
        id: craft-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CRAFT_MASTER_LOCATION }}
            ${{ env.CRAFT_MASTER_CONFIG }}
            ${{ github.workspace }}\craft-clone
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}
          key: ${{ runner.os }}-craft-v1-${{ env.CRAFT_TARGET }}-python-${{ env.PYTHON_VERSION }}-${{ steps.craft-revisions.outputs.key }}

      - name: Install Craft Master with Nextcloud Client Deps
        if: steps.craft-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & cmd /C "git clone -q --depth=1 https://github.com/KDE/craftmaster.git ${{ env.CRAFT_MASTER_LOCATION }} 2>&1"
          
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }
          
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|${{ steps.craft-revisions.outputs.kde_ref }}|"
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-nextcloud.git|${{ steps.craft-revisions.outputs.nextcloud_ref }}|"
          craft craft
          craft --install-deps nextcloud-client

      - name: Save Craft dependencies
        if: steps.craft-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CRAFT_MASTER_LOCATION }}
            ${{ env.CRAFT_MASTER_CONFIG }}
            ${{ github.workspace }}\craft-clone
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}
          key: ${{ runner.os }}-craft-v1-${{ env.CRAFT_TARGET }}-python-${{ env.PYTHON_VERSION }}-${{ steps.craft-revisions.outputs.key }}

      #- name: Cache Install inkscape
      #  id: cache-install-inkscape
      #  uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      #  with:
      #    path: C:\Program Files\inkscape
      #    key: ${{ runner.os }}-cache-install-inkscape

      - name: Install inkscape
      #  if: steps.cache-install-inkscape.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install inkscape

      - name: Setup PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
   
      - name: Compile
        shell: pwsh
        run: |
          if ('${{ inputs.create_installer }}' -eq 'true') {
              # Deployed privateCloud releases use the NextcloudDev profile and
              # keychain identity. Keep it until an explicit migration exists.
              $config = Get-Content -LiteralPath '${{ env.CRAFT_MASTER_CONFIG }}' -Raw
              $anchor = 'nextcloud-client.buildTests = True'
              if (!$config.Contains($anchor)) { throw 'Craft client settings were not found.' }
              $config.Replace($anchor, "$anchor`nnextcloud-client.devMode = True") |
                  Set-Content -LiteralPath '${{ env.CRAFT_MASTER_CONFIG }}' -Encoding utf8
          }
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }
          
          craft --src-dir ${{ github.workspace }} nextcloud-client
          
      - name: Run tests
        shell: pwsh
        timeout-minutes: 25
        env:
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          function runTests() {
              $buildFolder = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\build\nextcloud-client\work\build"

              cd $buildFolder

              $binFolder = "$buildFolder\bin"
              $diagnostics = Join-Path $env:RUNNER_TEMP 'privatecloud-test-diagnostics'
              New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
              $testDefinitions = (& ctest --show-only=json-v1 | ConvertFrom-Json).tests
              & ctest --output-on-failure --timeout 300 --output-junit (Join-Path $diagnostics 'ctest.xml')
              $testResult = $LASTEXITCODE
              if ($testResult -ne 0) {
                  # Some Windows Qt test binaries do not forward their text log
                  # to CTest. Collect an explicit file without masking the failure.
                  $failedList = Join-Path $buildFolder 'Testing/Temporary/LastTestsFailed.log'
                  if (Test-Path -LiteralPath $failedList) {
                      foreach ($failure in Get-Content -LiteralPath $failedList) {
                          if ($failure -notmatch '^\d+:([A-Za-z0-9_]+)$') { continue }
                          $testName = $Matches[1]
                          $testExe = Join-Path $binFolder ($testName + '.exe')
                          if (!(Test-Path -LiteralPath $testExe)) { continue }
                          $testLog = Join-Path $diagnostics ($testName + '.log')
                          $definition = $testDefinitions | Where-Object name -EQ $testName
                          $previousEnvironment = @{}
                          try {
                              foreach ($setting in ($definition.properties | Where-Object name -EQ 'ENVIRONMENT').value) {
                                  $key, $value = $setting -split '=', 2
                                  $previousEnvironment[$key] = [Environment]::GetEnvironmentVariable($key, 'Process')
                                  [Environment]::SetEnvironmentVariable($key, $value, 'Process')
                              }
                              $process = Start-Process -FilePath $testExe -ArgumentList ('-o "' + $testLog + ',txt"') -WorkingDirectory $binFolder -WindowStyle Hidden -PassThru
                              if (!$process.WaitForExit(60000)) {
                                  $process.Kill($true)
                                  $process.WaitForExit()
                                  Write-Warning "$testName diagnostic rerun exceeded 60 seconds"
                              }
                          } finally {
                              foreach ($key in $previousEnvironment.Keys) {
                                  [Environment]::SetEnvironmentVariable($key, $previousEnvironment[$key], 'Process')
                              }
                          }
                          if (Test-Path -LiteralPath $testLog) { Get-Content -LiteralPath $testLog }
                      }
                  }
              }
              exit $testResult
          }
          
          runTests

      - name: Preserve tested installer inputs
        if: ${{ inputs.create_installer }}
        shell: pwsh
        run: |
          $build = '${{ github.workspace }}\${{ env.CRAFT_TARGET }}\build\nextcloud-client\work\build'
          $inputs = Join-Path $env:RUNNER_TEMP 'privatecloud-tested-inputs'
          New-Item -ItemType Directory -Path "$inputs\bin", "$inputs\src\gui" | Out-Null
          $files = @('nextclouddev.exe', 'nextclouddevsync.dll', 'nextclouddev_csync.dll',
            'nextclouddevsync_vfs_cfapi.dll', 'CfApiShellExtensions.dll', 'privatecloud-runtime-requirements.json',
            'PrivateCloudAuthenticationTest.exe', 'PrivateCloudTransportTest.exe', 'PrivateCloudConnectRelayTest.exe')
          foreach ($name in $files) { Copy-Item -LiteralPath "$build\bin\$name" -Destination "$inputs\bin" }
          Copy-Item -LiteralPath "$build\src\gui\privateCloud.ico" -Destination "$inputs\src\gui"
          @{
            revision = '${{ github.sha }}'
            dependencyKey = '${{ runner.os }}-craft-v1-${{ env.CRAFT_TARGET }}-python-${{ env.PYTHON_VERSION }}-${{ steps.craft-revisions.outputs.key }}'
          } | ConvertTo-Json | Set-Content -LiteralPath "$inputs\build.json" -Encoding utf8

      - name: Upload tested installer inputs
        if: ${{ inputs.create_installer }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: privateCloud-tested-Windows-inputs
          path: ${{ runner.temp }}/privatecloud-tested-inputs
          if-no-files-found: error
          retention-days: 30

      - name: Collect CTest logs
        if: always()
        shell: pwsh
        run: |
          $testLogs = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\build\nextcloud-client\work\build\Testing\Temporary"
          $diagnostics = Join-Path $env:RUNNER_TEMP 'privatecloud-test-diagnostics'
          if (Test-Path -LiteralPath $testLogs) {
              New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
              Get-ChildItem -LiteralPath $testLogs -File | Copy-Item -Destination $diagnostics
          }

      - name: Preserve Windows test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: privatecloud-windows-test-diagnostics
          path: ${{ runner.temp }}/privatecloud-test-diagnostics
          if-no-files-found: ignore
          retention-days: 14

  package:
    needs: build
    if: ${{ always() && inputs.create_installer && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.tested_build_run != '')) }}
    name: Package tested privateCloud build
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    env:
      CRAFT_TARGET: windows-msvc2022_64-cl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: privateCloud-tested-Windows-inputs
          path: ${{ runner.temp }}/privatecloud-tested-inputs
          run-id: ${{ inputs.tested_build_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check compiled inputs match the current desktop source
        id: inputs
        shell: pwsh
        run: |
          $build = Get-Content -LiteralPath '${{ runner.temp }}\privatecloud-tested-inputs\build.json' -Raw | ConvertFrom-Json
          if ($build.revision -notmatch '^[0-9a-f]{40}$' -or $build.dependencyKey -notmatch '^Windows-craft-v1-windows-msvc2022_64-cl-python-3\.12-[0-9a-f-]+$') {
            throw 'Invalid tested-build metadata.'
          }
          git fetch --no-tags --depth=1 origin $build.revision
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch the tested source revision.' }
          git diff --quiet $build.revision HEAD -- src test theme cmake '*.cmake' CMakeLists.txt config.h.in resources.qrc craftmaster.ini
          if ($LASTEXITCODE -ne 0) { throw 'Desktop source differs from the tested binaries. Run a full build.' }
          "cache_key=$($build.dependencyKey)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Restore the tested runtime dependencies
        id: package-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}\CraftMaster
            ${{ github.workspace }}\craftmaster.ini
            ${{ github.workspace }}\craft-clone
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}
          key: ${{ steps.inputs.outputs.cache_key }}
          fail-on-cache-miss: true
      - name: Install runtime inspection dependency
        shell: pwsh
        run: python -m pip install pefile==2024.8.26
      - name: Build and verify privateCloud installer
        shell: pwsh
        run: |
          ./admin/win/privatecloud/package-windows.ps1 `
            -Source '${{ github.workspace }}' `
            -Build '${{ runner.temp }}\privatecloud-tested-inputs' `
            -Dependencies '${{ github.workspace }}\${{ env.CRAFT_TARGET }}' `
            -Output '${{ runner.temp }}\privatecloud-package'
      - name: Publish verified unsigned installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: privateCloud-Windows-x64-installer
          path: ${{ runner.temp }}/privatecloud-package/release
          if-no-files-found: error
          retention-days: 30
